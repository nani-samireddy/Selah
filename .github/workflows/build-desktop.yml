name: Build desktop packages
on:
  workflow_dispatch:
  push:
    branches: ['build/**']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows-x64
            qt_arch: win64_msvc2022_64
          - os: ubuntu-24.04
            platform: Linux-x64
            qt_arch: linux_gcc_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux deployment dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev libfontconfig1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libasound2t64 libpulse0 libva2 libva-drm2
      # PyPI aqt 3.3 predates Qt's split Windows repository layout (Qt 6.11+).
      - name: Install Windows Qt SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install 'git+https://github.com/miurahr/aqtinstall.git@4c759852b1108cc801d8e24979136b895b5155d4'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.12.1 win64_msvc2022_64 -O "$env:RUNNER_TEMP/Qt" -m qtmultimedia qtshadertools qtquicktimeline qtquick3d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qtRoot = "$env:RUNNER_TEMP/Qt/6.12.1/msvc2022_64"
          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$qtRoot/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'Linux'
        with:
          version: '6.12.1'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtmultimedia qtshadertools qtquicktimeline qtquick3d'
          setup-python: false
          cache: true
      - name: Build and package Release
        run: python scripts/package-desktop.py --jobs 2
      - name: Upload package and validation
        uses: actions/upload-artifact@v4
        with:
          name: Selah-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
